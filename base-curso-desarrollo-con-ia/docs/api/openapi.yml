                error: Order not found
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /orders/{orderId}/items/{itemId}/status:
    patch:
      tags: [Orders]
      operationId: updateOrderItemStatus
      summary: Cambiar estado de un ítem de pedido
      description: 'Roles: cualquier usuario autenticado (no hay `authorize()`).'
      x-roles: ['*']
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
