                error: 'Estado inválido: foo. Debe ser uno de: pendiente, preparando, listo, entregado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        example: rest-1
    TableId:
      name: id
      in: path
      required: true
      description: Id de la mesa (UUID; las del seed usan ids fijos como `table-1-3`).
      schema:
        type: string
        example: table-1-3

  responses:
    Unauthorized:
      description: |
        Respondido por `authenticate`: falta la cabecera, token mal formado, inválido o caducado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          examples:
            noToken:
              value:
                error: 'Unauthorized: No token provided'
            malformed:
              value:
                error: 'Unauthorized: Malformed token'
            invalid:
              value:
                error: 'Unauthorized: Invalid token'
    Forbidden:
      description: 'Respondido por `authorize(roles)`: el rol del JWT no está en la lista permitida.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'
    InternalError:
      description: Error no controlado (no es `AppError`), traducido por `errorHandler`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InternalServerError
            message: Something went wrong
    OrderInternalError:
      description: Error no controlado en `OrderController`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: Internal Server Error
    RestaurantNotFound:
      description: '`RestaurantNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RestaurantNotFoundError
            message: Restaurant not found
    RestaurantValidationError:
      description: |
        `RestaurantNameRequiredError`, `RestaurantAddressRequiredError`, `OwnerFirstNameRequiredError`,
        `OwnerLastNameRequiredError`, `InvalidEmailError`, `InvalidPhoneError`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InvalidPhoneError
            message: Invalid phone format
    DishNotFound:
      description: '`DishNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DishNotFoundError
            message: Dish not found
    DishValidationError:
      description: |
        `DishNameRequiredError`, `InvalidPriceError`, `InvalidCategoryError`, `RestaurantIdRequiredError`.
        (Un ingrediente inválido en `ingredients` lanza un `Error` genérico → 500.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InvalidPriceError
            message: Price must be a positive number
    IngredientNotFound:
      description: '`IngredientNotFoundError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: IngredientNotFoundError
            message: Ingredient not found
    IngredientValidationError:
      description: '`IngredientNameRequiredError`, `InvalidUnitError`, `NegativeStockError`, `RestaurantIdRequiredError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InvalidUnitError
            message: 'Invalid unit: litros. Must be one of: kg, g, l, ml, unidad'
    TableNotFound:
      description: |
        **NUEVO (issue 5).** `TableNotFoundError`: la mesa no existe o no pertenece al
        `restaurantId` de la ruta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TableNotFoundError
            message: Table not found
    TableValidationError:
      description: |
        **NUEVO (issue 5).** Uno de:
        - `InvalidTableNumberError` — `number` ausente, `null`, string (p. ej. `"3"`), decimal o ≤ 0.
        - `InvalidTableCapacityError` — `capacity` ausente, `null`, string (p. ej. `"4"`), decimal o ≤ 0.
        Solo se aceptan enteros JSON (sin conversión de tipos).
        - `InvalidTableStatusError` — `status` distinto de `libre`/`ocupada`/`reservada`.
        - `DuplicatedTableNumberError` — ya existe otra mesa con ese `number` en el mismo restaurante.
        - `RestaurantIdRequiredError` — `restaurantId` vacío.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicated:
              value:
                error: DuplicatedTableNumberError
                message: Table number already exists in this restaurant
            invalidNumber:
              value:
                error: InvalidTableNumberError
                message: Table number must be a positive integer
            invalidCapacity:
              value:
                error: InvalidTableCapacityError
                message: Table capacity must be a positive integer
            invalidStatus:
              value:
                error: InvalidTableStatusError
                message: 'Invalid table status: sucia. Must be one of: libre, ocupada, reservada'

  schemas:
    # ------------------------------------------------ Errores
    Error:
      type: object
      description: Error producido por `errorHandler`.
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            Nombre de la clase del error de dominio (`err.name`). Es el campo que usan los clientes
            para distinguir errores.
          example: TableNotFoundError
        message:
          type: string
          description: Texto legible del error, en inglés. No usarlo para distinguir errores.
          example: Table not found
    SimpleError:
      type: object
      description: Error de los middlewares `authenticate`/`authorize` y de `OrderController` (solo `error`, con un texto).
      required: [error]
      properties:
        error:
          type: string
          example: 'Forbidden: Insufficient permissions'

    # ------------------------------------------------ Auth / Employees
    EmployeeRole:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]
    Employee:
      type: object
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/EmployeeRole'
        restaurantId:
          type: string
          nullable: true
          description: '`null` para `admin` y `cliente`.'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          example: admin@resttek.com
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
          description: JWT (24 h) con payload `{ id, role, restaurantId }`.
        employee:
          $ref: '#/components/schemas/Employee'
    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          $ref: '#/components/schemas/EmployeeRole'
        restaurantId:
          type: string
          nullable: true
          default: null

    # ------------------------------------------------ Restaurants
    Restaurant:
      type: object
      required: [id, name, address, email, phone, ownerFirstName, ownerLastName, logoUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: rest-1
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
        address:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[\d\s\-()]{7,20}$'
        ownerFirstName:
          type: string
        ownerLastName:
          type: string
        logoUrl:
          type: string
          nullable: true
          default: null

    # ------------------------------------------------ Dishes
    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
      description: Se normaliza (`trim` + minúsculas) al guardar.
    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
    Dish:
      type: object
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        restaurantId:
          type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDishRequest:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          default: null
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          default: true
        ingredients:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DishIngredient'
    UpdateDishRequest:
      type: object
      required: [name, price, category, available]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
          default: null
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
        ingredients:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DishIngredient'

    # ------------------------------------------------ Ingredients
    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
      description: Se normaliza (`trim` + minúsculas) al guardar.
    Ingredient:
      type: object
      required: [id, name, unit, currentStock, restaurantId, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
        restaurantId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateIngredientRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
    UpdateIngredientRequest:
      type: object
      required: [name, unit, currentStock]
      properties:
        name:
          type: string
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0

    # ------------------------------------------------ Tables (NUEVO issue 5)
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
      description: |
        **NUEVO (issue 5).** Estado de la mesa. En la entrada se acepta con espacios/mayúsculas
        (se normaliza con `trim` + minúsculas); en la salida siempre va en minúsculas.
        - `libre`: disponible para que un cliente la ocupe.
        - `ocupada`: la ha ocupado un cliente o la ha marcado un empleado.
        - `reservada`: fijada manualmente por empleado/admin (no hay flujo de reservas). No se puede
          ocupar con `PATCH .../occupy` (400 `TableNotAvailableError`).
        Volver a `libre` es siempre manual, con `PATCH .../status`.
    Table:
      type: object
      description: |
        **NUEVO (issue 5).** Mesa de un restaurante. Todos los campos están siempre presentes en
        la respuesta (`description` es `string` o `null`, nunca ausente).
      required: [id, restaurantId, number, description, capacity, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: UUID (en el seed, ids fijos `table-<n restaurante>-<n mesa>`).
          example: table-1-3
        restaurantId:
          type: string
          example: rest-1
        number:
          type: integer
          minimum: 1
          description: Número visible de la mesa, único dentro del restaurante.
          example: 3
        description:
          type: string
          nullable: true
          description: Siempre presente; `null` si no tiene descripción.
          example: Junto a la ventana
        capacity:
          type: integer
          minimum: 1
          description: Número máximo de comensales.
          example: 4
        status:
          $ref: '#/components/schemas/TableStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTableRequest:
      type: object
      description: |
        **NUEVO (issue 5).** `restaurantId` se toma de la ruta. `number` y `capacity` deben ser
        enteros JSON (`"3"` como string → 400).
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          description: Entero JSON ≥ 1. String, decimal o ≤ 0 → 400 `InvalidTableNumberError`.
          example: 7
        capacity:
          type: integer
          minimum: 1
          description: Entero JSON ≥ 1. String, decimal o ≤ 0 → 400 `InvalidTableCapacityError`.
          example: 4
        description:
          type: string
          nullable: true
          default: null
          example: Terraza
        status:
          allOf:
            - $ref: '#/components/schemas/TableStatus'
          default: libre
    UpdateTableRequest:
      type: object
      description: |
        **NUEVO (issue 5).** `description` omitida → `null`. `status` omitido → se conserva el actual.
        `number` y `capacity` deben ser enteros JSON (`"3"` como string → 400).
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          description: Entero JSON ≥ 1. String, decimal o ≤ 0 → 400 `InvalidTableNumberError`.
          example: 7
        capacity:
          type: integer
          minimum: 1
          description: Entero JSON ≥ 1. String, decimal o ≤ 0 → 400 `InvalidTableCapacityError`.
          example: 6
        description:
          type: string
          nullable: true
          default: null
        status:
          $ref: '#/components/schemas/TableStatus'
    ChangeTableStatusRequest:
      type: object
      description: '**NUEVO (issue 5).**'
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TableStatus'

    # ------------------------------------------------ Orders
    OrderItemStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      description: Se normaliza (`trim` + minúsculas).
    OrderItem:
      type: object
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
        dishId:
          type: string
        quantity:
          type: integer
          description: Siempre 1 (las cantidades se expanden en ítems individuales).
          example: 1
        notes:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderItemStatus'
        dishName:
          type: string
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
        dishPrice:
          type: number
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
        dishCategory:
          type: string
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableId:
          type: string
          nullable: true
          description: |
            Id de la mesa (`Table.id`). Desde la issue 5 debe ser el id de una mesa real; los pedidos
            antiguos pueden tener valores arbitrarios o `null`.
          example: table-1-5
        tableNumber:
          type: integer
          nullable: true
          description: |
            **NUEVO (issue 5).** `Table.number` de la mesa del pedido, obtenido con `LEFT JOIN tables`.
            Presente en `GET /orders/active`, `GET /orders/mine` y `GET /orders/{id}`;
            **ausente** en la respuesta de `POST /orders`. `null` si el pedido no tiene mesa o
            su `tableId` no corresponde a ninguna mesa existente. Mostrar como
            `tableNumber ?? tableId`.
          example: 5
        clientId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
          description: Solo en `GET /orders/mine` y `GET /orders/{id}`.
        restaurantLogoUrl:
          type: string
          nullable: true
          description: Solo en `GET /orders/mine` y `GET /orders/{id}`.
    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          example: rest-1
        tableId:
          type: string
          nullable: true
          default: null
          description: |
            **NUEVO (issue 5):** id de la mesa ocupada por el cliente (`Table.id`, no el `number`).
            La API lo guarda tal cual, sin validarlo. Si se omite se guarda `null`.
          example: table-1-3
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
              quantity:
                type: integer
                minimum: 1
                example: 2
              notes:
                type: string
                nullable: true
