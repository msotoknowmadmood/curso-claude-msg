                  $ref: '#/components/schemas/Order'
        '400':
          description: Falta `restaurantId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: restaurantId is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /orders/mine:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: Pedidos del usuario autenticado
      description: |
        Roles: cualquier usuario autenticado. Pedidos cuyo `clientId` es el del JWT,
        ordenados por `createdAt` descendente. Incluye `restaurantName`, `restaurantLogoUrl`
        y `tableNumber` (NUEVO issue 5).
      x-roles: ['*']
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Detalle de pedido
      description: |
        Roles: cualquier usuario autenticado (no se comprueba que el pedido sea del usuario).
        Incluye `restaurantName`, `restaurantLogoUrl` y `tableNumber` (NUEVO issue 5).
      x-roles: ['*']
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Pedido inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
